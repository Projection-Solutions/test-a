<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walter Reed SP Program - Standardized Patient Invoice</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #1a202c;
      --border-color: #cbd5e1;
      --primary-color: #0f172a;
      --primary-hover: #1e293b;
      --accent-color: #2563eb;
      --danger-color: #dc2626;
      --danger-hover: #b91c1c;
      --light-gray: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      padding: 32px;
    }

    header {
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.75rem;
      color: var(--primary-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.95rem;
      color: #475569;
      font-weight: 600;
    }

    .header-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
      background-color: var(--light-gray);
      padding: 20px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-group input {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.95rem;
      background-color: #ffffff;
      color: var(--text-color);
    }

    .form-group input:focus {
      outline: 2px solid var(--accent-color);
      border-color: transparent;
    }

    .table-container {
      overflow-x: auto;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background-color: var(--primary-color);
      color: #ffffff;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    td input[type="text"],
    td input[type="time"],
    td input[type="number"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
    }

    td input[readonly] {
      background-color: #e2e8f0;
      color: #334155;
      font-weight: 600;
      cursor: not-allowed;
    }

    .signature-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    canvas.sig-pad {
      border: 1px dashed #94a3b8;
      background-color: #ffffff;
      border-radius: 4px;
      cursor: crosshair;
      touch-action: none;
    }

    .btn-clear-sig {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 2px;
    }

    .btn-clear-sig:hover {
      color: var(--danger-hover);
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }

    .btn-add {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    .btn-add:hover {
      background-color: #1d4ed8;
    }

    .btn-remove {
      background-color: var(--danger-color);
      color: #ffffff;
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-remove:hover {
      background-color: var(--danger-hover);
    }

    .btn-submit {
      background-color: var(--primary-color);
      color: #ffffff;
      font-size: 1rem;
      padding: 12px 28px;
      width: 100%;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .totals-card {
      background-color: var(--light-gray);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px 24px;
      min-width: 280px;
      margin-left: auto;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 0.95rem;
    }

    .totals-row.grand-total {
      border-top: 2px solid var(--border-color);
      margin-top: 6px;
      padding-top: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-color);
    }

    .status-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .status-message.success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block;
    }

    .status-message.error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }

    .status-message.info {
      background-color: #e0f2fe;
      color: #075985;
      border: 1px solid #bae6fd;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Walter Reed Standardized Patient Program</h1>
      <p>Standardized Patient Payment & Hours Invoice</p>
    </header>

    <form id="invoiceForm" onsubmit="handleFormSubmit(event)">
      <!-- Header Fields -->
      <div class="header-grid">
        <div class="form-group">
          <label for="eventId">Event ID</label>
          <input type="text" id="eventId" required placeholder="e.g., EVT-2026-089">
        </div>
        <div class="form-group">
          <label for="programName">Program Name</label>
          <input type="text" id="programName" required placeholder="e.g., Ophthalmic Surgery Lab">
        </div>
        <div class="form-group">
          <label for="eventDate">Event Date</label>
          <input type="date" id="eventDate" required>
        </div>
      </div>

      <!-- Line Items Table -->
      <div class="table-container">
        <table id="spTable">
          <thead>
            <tr>
              <th style="width: 22%;">SP Name</th>
              <th style="width: 11%;">Start Time</th>
              <th style="width: 11%;">End Time</th>
              <th style="width: 10%;">Total Hours</th>
              <th style="width: 10%;">Rate ($/hr)</th>
              <th style="width: 11%;">Subtotal</th>
              <th style="width: 20%;">Digital Signature</th>
              <th style="width: 5%;">Action</th>
            </tr>
          </thead>
          <tbody id="spTableBody">
            <!-- Rows added dynamically -->
          </tbody>
        </table>
      </div>

      <!-- Action Bar & Totals -->
      <div class="action-bar">
        <button type="button" class="btn btn-add" onclick="addSpRow()">+ Add Standardized Patient</button>

        <div class="totals-card">
          <div class="totals-row">
            <span>Total Event Hours:</span>
            <span id="grandTotalHours">0.00 hrs</span>
          </div>
          <div class="totals-row grand-total">
            <span>Event Total Cost:</span>
            <span id="grandTotalCost">$0.00</span>
          </div>
        </div>
      </div>

      <!-- Submit Section -->
      <button type="submit" id="submitBtn" class="btn btn-submit">Submit Invoice</button>
      <div id="statusMessage" class="status-message"></div>
    </form>
  </div>

  <script>
    const DEFAULT_RATE = 25.00;
    let rowCounter = 0;

    // Initialize with 1 default row on load
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('eventDate').valueAsDate = new Date();
      addSpRow();
    });

    /**
     * Dynamically adds a new row for an SP entry.
     */
    function addSpRow() {
      rowCounter++;
      const rowId = `row_${rowCounter}`;
      const tbody = document.getElementById('spTableBody');

      const tr = document.createElement('tr');
      tr.id = rowId;
      tr.innerHTML = `
        <td>
          <input type="text" name="spName" required placeholder="Full Legal Name">
        </td>
        <td>
          <input type="time" name="startTime" required onchange="calculateRow('${rowId}')">
        </td>
        <td>
          <input type="time" name="endTime" required onchange="calculateRow('${rowId}')">
        </td>
        <td>
          <input type="number" name="totalHours" step="0.01" readonly value="0.00">
        </td>
        <td>
          <input type="number" name="hourlyRate" step="0.01" value="${DEFAULT_RATE.toFixed(2)}" oninput="calculateRow('${rowId}')">
        </td>
        <td>
          <input type="text" name="subtotal" readonly value="$0.00">
        </td>
        <td>
          <div class="signature-container">
            <canvas id="canvas_${rowId}" class="sig-pad" width="180" height="60"></canvas>
            <button type="button" class="btn-clear-sig" onclick="clearSignature('${rowId}')">Clear Signature</button>
          </div>
        </td>
        <td style="text-align: center;">
          <button type="button" class="btn btn-remove" onclick="removeSpRow('${rowId}')">X</button>
        </td>
      `;

      tbody.appendChild(tr);
      initSignaturePad(`canvas_${rowId}`);
    }

    /**
     * Removes an SP row and recalculates overall totals.
     */
    function removeSpRow(rowId) {
      const tbody = document.getElementById('spTableBody');
      if (tbody.children.length <= 1) {
        alert('An invoice must contain at least one Standardized Patient entry.');
        return;
      }
      const row = document.getElementById(rowId);
      if (row) {
        row.remove();
        calculateGrandTotals();
      }
    }

    /**
     * Calculates total hours and subtotal for a single row.
     */
    function calculateRow(rowId) {
      const row = document.getElementById(rowId);
      if (!row) return;

      const startTimeVal = row.querySelector('input[name="startTime"]').value;
      const endTimeVal = row.querySelector('input[name="endTime"]').value;
      const rateVal = parseFloat(row.querySelector('input[name="hourlyRate"]').value) || 0;

      const hoursInput = row.querySelector('input[name="totalHours"]');
      const subtotalInput = row.querySelector('input[name="subtotal"]');

      if (startTimeVal && endTimeVal) {
        const start = new Date(`1970-01-01T${startTimeVal}:00`);
        let end = new Date(`1970-01-01T${endTimeVal}:00`);

        // Handle overnight shifts if end time is before start time
        if (end < start) {
          end.setDate(end.getDate() + 1);
        }

        const diffMs = end - start;
        const diffHours = Math.max(0, diffMs / (1000 * 60 * 60));
        const subtotal = diffHours * rateVal;

        hoursInput.value = diffHours.toFixed(2);
        subtotalInput.value = `$${subtotal.toFixed(2)}`;
      } else {
        hoursInput.value = "0.00";
        subtotalInput.value = "$0.00";
      }

      calculateGrandTotals();
    }

    /**
     * Calculates total event hours and grand total cost across all rows.
     */
    function calculateGrandTotals() {
      const rows = document.querySelectorAll('#spTableBody tr');
      let grandTotalHours = 0;
      let grandTotalCost = 0;

      rows.forEach(row => {
        const hours = parseFloat(row.querySelector('input[name="totalHours"]').value) || 0;
        const subtotalText = row.querySelector('input[name="subtotal"]').value.replace('$', '');
        const subtotal = parseFloat(subtotalText) || 0;

        grandTotalHours += hours;
        grandTotalCost += subtotal;
      });

      document.getElementById('grandTotalHours').textContent = `${grandTotalHours.toFixed(2)} hrs`;
      document.getElementById('grandTotalCost').textContent = `$${grandTotalCost.toFixed(2)}`;
    }

    /**
     * Attaches mouse and touch drawing listeners to a canvas element.
     */
    function initSignaturePad(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      let isDrawing = false;

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';

      function getPos(evt) {
        const rect = canvas.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function startDrawing(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }

      function stopDrawing() {
        isDrawing = false;
      }

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', startDrawing);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', stopDrawing);
    }

    /**
     * Clears canvas contents for a row.
     */
    function clearSignature(rowId) {
      const canvas = document.getElementById(`canvas_${rowId}`);
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    /**
     * Validates canvas content to confirm it isn't blank.
     */
    function isCanvasBlank(canvas) {
      const context = canvas.getContext('2d');
      const pixelBuffer = new Uint32Array(
        context.getImageData(0, 0, canvas.width, canvas.height).data.buffer
      );
      return !pixelBuffer.some(color => color !== 0);
    }

    /**
     * Handles submission to Google Apps Script backend.
     */
    function handleFormSubmit(event) {
      event.preventDefault();

      const statusEl = document.getElementById('statusMessage');
      const submitBtn = document.getElementById('submitBtn');

      statusEl.className = 'status-message info';
      statusEl.textContent = 'Submitting invoice, please wait...';
      submitBtn.disabled = true;

      const spRows = [];
      const rows = document.querySelectorAll('#spTableBody tr');
      let missingSig = false;

      rows.forEach(row => {
        const canvas = row.querySelector('canvas');
        if (isCanvasBlank(canvas)) {
          missingSig = true;
        }

        spRows.push({
          spName: row.querySelector('input[name="spName"]').value,
          startTime: row.querySelector('input[name="startTime"]').value,
          endTime: row.querySelector('input[name="endTime"]').value,
          totalHours: row.querySelector('input[name="totalHours"]').value,
          hourlyRate: row.querySelector('input[name="hourlyRate"]').value,
          subtotal: row.querySelector('input[name="subtotal"]').value,
          signatureData: canvas.toDataURL('image/png')
        });
      });

      if (missingSig) {
        statusEl.className = 'status-message error';
        statusEl.textContent = 'Error: All Standardized Patients must provide a digital signature before submitting.';
        submitBtn.disabled = false;
        return;
      }

      const payload = {
        eventId: document.getElementById('eventId').value,
        programName: document.getElementById('programName').value,
        eventDate: document.getElementById('eventDate').value,
        grandTotalHours: document.getElementById('grandTotalHours').textContent,
        grandTotalCost: document.getElementById('grandTotalCost').textContent,
        spRows: spRows
      };

      // Call Google Apps Script backend execution
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(response => {
            if (response.success) {
              statusEl.className = 'status-message success';
              statusEl.textContent = response.message || 'Invoice successfully submitted!';
              document.getElementById('invoiceForm').reset();
              document.getElementById('spTableBody').innerHTML = '';
              addSpRow();
              calculateGrandTotals();
            } else {
              statusEl.className = 'status-message error';
              statusEl.textContent = 'Submission failed: ' + response.message;
            }
            submitBtn.disabled = false;
          })
          .withFailureHandler(err => {
            statusEl.className = 'status-message error';
            statusEl.textContent = 'Server Error: ' + err.toString();
            submitBtn.disabled = false;
          })
          .processInvoice(payload);
      } else {
        // Fallback testing state for local execution outside GAS environment
        console.log('Payload created:', payload);
        setTimeout(() => {
          statusEl.className = 'status-message success';
          statusEl.textContent = 'Local Test Mode: Form payload logged to browser console successfully.';
          submitBtn.disabled = false;
        }, 1000);
      }
    }
  </script>
</body>
</html>
