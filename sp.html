<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walter Reed SP Program - Standardized Patient Invoice</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #1a202c;
      --border-color: #cbd5e1;
      --primary-color: #0f172a;
      --primary-hover: #1e293b;
      --accent-color: #2563eb;
      --danger-color: #dc2626;
      --danger-hover: #b91c1c;
      --light-gray: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      padding: 32px;
    }

    header {
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.75rem;
      color: var(--primary-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.95rem;
      color: #475569;
      font-weight: 600;
    }

    .header-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
      background-color: var(--light-gray);
      padding: 20px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-group input {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.95rem;
      background-color: #ffffff;
      color: var(--text-color);
    }

    .table-container {
      overflow-x: auto;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background-color: var(--primary-color);
      color: #ffffff;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    td input[type="text"],
    td input[type="number"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
    }

    td input[readonly] {
      background-color: #e2e8f0;
      color: #334155;
      font-weight: 600;
      cursor: not-allowed;
    }

    .signature-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    canvas.sig-pad {
      border: 1px dashed #94a3b8;
      background-color: #ffffff;
      border-radius: 4px;
      cursor: crosshair;
      touch-action: none;
    }

    .btn-clear-sig {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 2px;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-add { background-color: var(--accent-color); color: #ffffff; }
    .btn-add:hover { background-color: #1d4ed8; }

    .btn-remove { background-color: var(--danger-color); color: #ffffff; padding: 6px 10px; font-size: 0.8rem; }
    .btn-remove:hover { background-color: var(--danger-hover); }

    .btn-submit { background-color: var(--primary-color); color: #ffffff; font-size: 1rem; padding: 12px 28px; width: 100%; }
    .btn-submit:hover { background-color: var(--primary-hover); }
    .btn-submit:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .totals-card {
      background-color: var(--light-gray);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px 24px;
      min-width: 280px;
      margin-left: auto;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 0.95rem;
    }

    .totals-row.grand-total {
      border-top: 2px solid var(--border-color);
      margin-top: 6px;
      padding-top: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-color);
    }

    .status-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .status-message.success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .status-message.error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    .status-message.info { background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Walter Reed Standardized Patient Program</h1>
      <p>Standardized Patient Payment & Hours Invoice</p>
    </header>

    <form id="invoiceForm" onsubmit="handleFormSubmit(event)">
      <div class="header-grid">
        <div class="form-group">
          <label for="eventId">Event ID</label>
          <input type="text" id="eventId" required placeholder="e.g., EVT-2026-089">
        </div>
        <div class="form-group">
          <label for="programName">Program Name</label>
          <input type="text" id="programName" required placeholder="e.g., Ophthalmic Surgery Lab">
        </div>
        <div class="form-group">
          <label for="eventDate">Event Date</label>
          <input type="date" id="eventDate" required>
        </div>
      </div>

      <div class="table-container">
        <table id="spTable">
          <thead>
            <tr>
              <th style="width: 30%;">SP Name</th>
              <th style="width: 15%;">Total Hours</th>
              <th style="width: 15%;">Rate ($/hr)</th>
              <th style="width: 15%;">Subtotal</th>
              <th style="width: 20%;">Digital Signature</th>
              <th style="width: 5%;">Action</th>
            </tr>
          </thead>
          <tbody id="spTableBody"></tbody>
        </table>
      </div>

      <div class="action-bar">
        <button type="button" class="btn btn-add" onclick="addSpRow()">+ Add Standardized Patient</button>

        <div class="totals-card">
          <div class="totals-row">
            <span>Total Event Hours:</span>
            <span id="grandTotalHours">0.00 hrs</span>
          </div>
          <div class="totals-row grand-total">
            <span>Event Total Cost:</span>
            <span id="grandTotalCost">$0.00</span>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-submit">Submit Invoice</button>
      <div id="statusMessage" class="status-message"></div>
    </form>
  </div>

  <script>
    const DEFAULT_RATE = 25.00;
    let rowCounter = 0;

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('eventDate').valueAsDate = new Date();
      addSpRow();
    });

    function addSpRow() {
      rowCounter++;
      const rowId = `row_${rowCounter}`;
      const tbody = document.getElementById('spTableBody');

      const tr = document.createElement('tr');
      tr.id = rowId;
      tr.innerHTML = `
        <td><input type="text" name="spName" required placeholder="Full Legal Name"></td>
        <td><input type="number" name="totalHours" step="0.25" min="0" value="0.00" required oninput="calculateRow('${rowId}')"></td>
        <td><input type="number" name="hourlyRate" step="0.01" value="${DEFAULT_RATE.toFixed(2)}" oninput="calculateRow('${rowId}')"></td>
        <td><input type="text" name="subtotal" readonly value="$0.00"></td>
        <td>
          <div class="signature-container">
            <canvas id="canvas_${rowId}" class="sig-pad" width="180" height="60"></canvas>
            <button type="button" class="btn-clear-sig" onclick="clearSignature('${rowId}')">Clear Signature</button>
          </div>
        </td>
        <td style="text-align: center;">
          <button type="button" class="btn btn-remove" onclick="removeSpRow('${rowId}')">X</button>
        </td>
      `;

      tbody.appendChild(tr);
      initSignaturePad(`canvas_${rowId}`);
    }

    function removeSpRow(rowId) {
      const tbody = document.getElementById('spTableBody');
      if (tbody.children.length <= 1) {
        alert('An invoice must contain at least one Standardized Patient entry.');
        return;
      }
      document.getElementById(rowId)?.remove();
      calculateGrandTotals();
    }

    function calculateRow(rowId) {
      const row = document.getElementById(rowId);
      if (!row) return;

      const hoursVal = parseFloat(row.querySelector('input[name="totalHours"]').value) || 0;
      const rateVal = parseFloat(row.querySelector('input[name="hourlyRate"]').value) || 0;
      
      row.querySelector('input[name="subtotal"]').value = `$${(hoursVal * rateVal).toFixed(2)}`;
      calculateGrandTotals();
    }

    function calculateGrandTotals() {
      let grandTotalHours = 0;
      let grandTotalCost = 0;

      document.querySelectorAll('#spTableBody tr').forEach(row => {
        grandTotalHours += parseFloat(row.querySelector('input[name="totalHours"]').value) || 0;
        grandTotalCost += parseFloat(row.querySelector('input[name="subtotal"]').value.replace('$', '')) || 0;
      });

      document.getElementById('grandTotalHours').textContent = `${grandTotalHours.toFixed(2)} hrs`;
      document.getElementById('grandTotalCost').textContent = `$${grandTotalCost.toFixed(2)}`;
    }

    function initSignaturePad(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      let isDrawing = false;

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function start(e) { e.preventDefault(); isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
      function move(e) { if (!isDrawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      function stop() { isDrawing = false; }

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      canvas.addEventListener('mouseup', stop);
      canvas.addEventListener('mouseleave', stop);
      canvas.addEventListener('touchstart', start);
      canvas.addEventListener('touchmove', move);
      canvas.addEventListener('touchend', stop);
    }

    function clearSignature(rowId) {
      const canvas = document.getElementById(`canvas_${rowId}`);
      canvas?.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    function isCanvasBlank(canvas) {
      const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
      return !new Uint32Array(data.buffer).some(color => color !== 0);
    }

    function handleFormSubmit(event) {
      event.preventDefault();

      const statusEl = document.getElementById('statusMessage');
      const submitBtn = document.getElementById('submitBtn');

      statusEl.className = 'status-message info';
      statusEl.textContent = 'Submitting invoice to Google Sheets...';
      submitBtn.disabled = true;

      const spRows = [];
      let missingSig = false;

      document.querySelectorAll('#spTableBody tr').forEach(row => {
        const canvas = row.querySelector('canvas');
        if (isCanvasBlank(canvas)) missingSig = true;

        spRows.push({
          spName: row.querySelector('input[name="spName"]').value,
          totalHours: row.querySelector('input[name="totalHours"]').value,
          hourlyRate: row.querySelector('input[name="hourlyRate"]').value,
          subtotal: row.querySelector('input[name="subtotal"]').value,
          signatureData: canvas.toDataURL('image/png')
        });
      });

      if (missingSig) {
        statusEl.className = 'status-message error';
        statusEl.textContent = 'Error: All Standardized Patients must provide a digital signature.';
        submitBtn.disabled = false;
        return;
      }

      const payload = {
        eventId: document.getElementById('eventId').value,
        programName: document.getElementById('programName').value,
        eventDate: document.getElementById('eventDate').value,
        grandTotalHours: document.getElementById('grandTotalHours').textContent,
        grandTotalCost: document.getElementById('grandTotalCost').textContent,
        spRows: spRows
      };

      google.script.run
        .withSuccessHandler(response => {
          if (response.success) {
            statusEl.className = 'status-message success';
            statusEl.textContent = response.message;
            document.getElementById('invoiceForm').reset();
            document.getElementById('spTableBody').innerHTML = '';
            addSpRow();
            calculateGrandTotals();
          } else {
            statusEl.className = 'status-message error';
            statusEl.textContent = 'Submission failed: ' + response.message;
          }
          submitBtn.disabled = false;
        })
        .withFailureHandler(err => {
          statusEl.className = 'status-message error';
          statusEl.textContent = 'Server Error: ' + err.toString();
          submitBtn.disabled = false;
        })
        .processInvoice(payload);
    }
  </script>
</body>
</html>
